# Netlify configuration for the PulmoScan AI frontend (React + Vite).
# Netlify hosts ONLY the static frontend. The FastAPI backend runs elsewhere
# (see README) and its URL is supplied through the VITE_API_URL variable:
#   Netlify dashboard -> Site configuration -> Environment variables
#   VITE_API_URL = https://<your-backend-host>      (no trailing slash)

[build]
  base = "frontend"          # folder that contains package.json
  command = "npm run build"  # runs `vite build`
  publish = "dist"           # relative to base -> frontend/dist

[build.environment]
  NODE_VERSION = "22"

# Single-page-app fallback: React Router handles /analyze, /insights, /about
# in the browser, so every unknown path must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
