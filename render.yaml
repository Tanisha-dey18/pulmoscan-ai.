# Render.com blueprint for the backend.
# New + -> Blueprint -> pick this repository.
# The API uses roughly 420 MB of RAM with the model loaded, which is close to
# the 512 MB limit of the free instance. If the service is killed for running
# out of memory, change `plan` to a 1 GB+ instance.
services:
  - type: web
    name: pulmoscan-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # set in the dashboard, e.g. https://pulmoscan-ai.netlify.app
